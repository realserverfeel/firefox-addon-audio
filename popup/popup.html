<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Azure TTS Reader Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="toggle-row">
      <h2>Azure TTS Reader</h2>
      <label class="switch">
        <input type="checkbox" id="addon-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <p class="subtitle" id="toggle-status">Enabled</p>

    <div class="form-group">
      <label for="api-key">API Key</label>
      <input type="password" id="api-key" placeholder="Enter your Azure Speech API Key">
      <button class="toggle-btn" id="toggle-key">Show</button>
    </div>

    <div class="form-group">
      <label for="region">Region</label>
      <select id="region">
        <option value="eastus">East US</option>
        <option value="eastus2">East US 2</option>
        <option value="westus">West US</option>
        <option value="westus2">West US 2</option>
        <option value="centralus">Central US</option>
        <option value="northcentralus">North Central US</option>
        <option value="southcentralus">South Central US</option>
        <option value="eastasia">East Asia (Hong Kong)</option>
        <option value="southeastasia">Southeast Asia (Singapore)</option>
        <option value="japaneast">Japan East (Tokyo)</option>
        <option value="japanwest">Japan West (Osaka)</option>
        <option value="koreacentral">Korea Central (Seoul)</option>
        <option value="westeurope">West Europe</option>
        <option value="northeurope">North Europe</option>
        <option value="uksouth">UK South</option>
        <option value="australiaeast">Australia East</option>
      </select>
    </div>

    <div class="form-group">
      <label for="output-format">Audio Quality</label>
      <select id="output-format">
        <option value="audio-16khz-128kbitrate-mono-mp3">MP3 Standard (16kHz)</option>
        <option value="audio-48khz-192kbitrate-mono-mp3">MP3 High Quality (48kHz)</option>
        <option value="ogg-24khz-16bit-mono-opus">OGG Opus (smallest)</option>
      </select>
    </div>

    <div class="actions">
      <button class="btn primary" id="save-btn">Save Settings</button>
      <button class="btn" id="test-btn">Test Connection</button>
    </div>

    <div class="status" id="status"></div>

    <div class="help">
      <h3>How to get your API Key:</h3>
      <ol>
        <li>Go to <a href="https://portal.azure.com" target="_blank">Azure Portal</a></li>
        <li>Create a Speech resource (Pricing: F0 Free)</li>
        <li>Go to Keys and Endpoint</li>
        <li>Copy Key 1</li>
      </ol>
      <p class="note">Free tier: 500,000 characters/month</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
