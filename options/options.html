<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container">
    <h2>Azure TTS Reader</h2>
    <p class="section-title">Preferences</p>

    <div class="toggle-row">
      <div>
        <span class="toggle-label">Show button on left side</span>
        <p class="subtitle" id="side-status">Off — button is on the right edge</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="side-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
